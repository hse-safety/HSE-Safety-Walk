<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00131f">
<title>SAFETY WALK 1.0 – Login</title>
<style>
:root{
  --green:#12843b;
  --green-dark:#0b6a2f;
  --ink:#111820;
  --mut:#6f7780;
  --line:#dfe4e8;
  --bg:#f4f6f7;
  --red:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
body{display:grid;place-items:center;padding:18px}
.shell{
  width:min(1280px,100%);
  min-height:760px;
  background:#fff;
  border:1px solid #d9dfe3;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 22px 60px rgba(0,0,0,.14);
  display:grid;
  grid-template-columns:minmax(460px,1fr) minmax(520px,1fr);
}
.visual{
  position:relative;
  min-height:760px;
  background:#030808;
  overflow:hidden;
}
.visual img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.panel{
  min-height:760px;
  padding:70px 74px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:#fff;
}
.card{display:none}
.card.active{display:block}
h1,h2,h3,p{margin-top:0}
.login-title{
  font-size:56px;
  line-height:1;
  margin-bottom:42px;
  font-weight:800;
  letter-spacing:-1px;
}
label{
  display:block;
  font-size:18px;
  font-weight:700;
  margin:0 0 10px;
}
.field{margin-bottom:26px}
.input-wrap{position:relative}
input{
  width:100%;
  height:68px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 18px;
  font-size:18px;
  outline:none;
  background:#fff;
}
input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(18,132,59,.10)
}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
button{
  border:0;
  border-radius:14px;
  min-height:62px;
  padding:0 24px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}
.primary{
  width:100%;
  background:linear-gradient(180deg,var(--green),var(--green-dark));
  color:#fff;
}
.secondary{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
}
.warning{
  background:#fff7e9;
  color:#8a5300;
  border:1px solid #ecd2a5;
}
.danger{
  background:#fff1ef;
  color:var(--red);
  border:1px solid #efc1ba;
}
.status{
  min-height:24px;
  margin-top:14px;
  font-size:15px;
  font-weight:700;
  color:var(--red);
}
.status.ok{color:var(--green-dark)}
.session{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding-bottom:24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line);
}
.session.show{display:flex}
.session strong{font-size:18px}
.session span{display:block;color:var(--mut);font-size:14px;margin-top:3px}
.session button{min-height:44px;font-size:15px;padding:0 16px}
.ready h2{font-size:42px;margin-bottom:12px}
.ready p{font-size:18px;color:var(--mut);margin-bottom:28px}
.ready .row{margin-top:0}
.ready .primary{width:auto;min-width:260px}
.admin h2{font-size:38px;margin-bottom:22px}
.userlist{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  margin:0 0 26px;
}
.user{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  padding:14px;
  border-bottom:1px solid var(--line);
}
.user:last-child{border-bottom:0}
.user.disabled{background:#fafafa;opacity:.62}
.user small{display:block;color:var(--mut);margin-top:4px}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.actions button{min-height:36px;height:36px;padding:0 10px;font-size:12px}
.admin .field{margin-bottom:18px}
.admin input{height:54px;font-size:16px}
.admin label{font-size:15px}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}

.login-view{display:contents}
.login-view:not(.active){display:none}
.mobile-brand,.mobile-help{display:none}
.field-icon,.eye-toggle{display:none}

@media(max-width:900px){
  html,body{width:100%;min-height:100%;background:#00131f}
  body{display:block;padding:0;min-height:100svh;overflow-x:hidden}
  .shell{
    position:relative;display:block;width:100%;min-height:100svh;
    border:0;border-radius:0;box-shadow:none;overflow:hidden;background:#00131f
  }
  .visual{
    position:fixed;inset:0;z-index:0;min-height:100svh;height:100svh;overflow:hidden;
    background:
      radial-gradient(circle at -8% -4%,transparent 0 18%,rgba(0,190,210,.20) 18.1% 18.35%,transparent 18.5% 23.5%,rgba(0,190,210,.18) 23.6% 23.85%,transparent 24% 29%,rgba(0,190,210,.15) 29.1% 29.35%,transparent 29.5% 35%,rgba(0,190,210,.11) 35.1% 35.35%,transparent 35.5%),
      radial-gradient(circle at 111% 101%,transparent 0 26%,rgba(0,190,210,.18) 26.1% 26.35%,transparent 26.5% 32%,rgba(0,190,210,.15) 32.1% 32.35%,transparent 32.5% 38%,rgba(0,190,210,.12) 38.1% 38.35%,transparent 38.5% 44%,rgba(0,190,210,.09) 44.1% 44.35%,transparent 44.5%),
      linear-gradient(155deg,#00111d 0%,#001827 48%,#00111c 100%)
  }
  .visual::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 35%,rgba(12,49,66,.17),transparent 48%),linear-gradient(to bottom,rgba(0,0,0,.02),rgba(0,0,0,.15))
  }
  .visual img{display:none}

  .panel{
    position:relative;z-index:2;width:100%;min-height:100svh;padding:0;
    display:block;background:transparent
  }

  .login-view.active{
    width:100%;min-height:100svh;
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 12px)
  }

  .mobile-brand{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:clamp(36px,6.5svh,66px)
  }
  .mobile-logo{
    width:58px;height:58px;margin:0 auto 22px;opacity:.82;filter:drop-shadow(0 1px 8px rgba(0,0,0,.35))
  }
  .mobile-logo svg{display:block;width:100%;height:100%;overflow:visible}
  .mobile-brand-title{
    display:block;width:100%;margin:0;text-align:center;white-space:nowrap;
    color:rgba(245,247,249,.84);font-size:clamp(34px,9.2vw,44px);line-height:.98;
    font-weight:900;letter-spacing:-.035em;text-shadow:0 2px 12px rgba(0,0,0,.42)
  }

  #loginCard{
    align-self:center;justify-self:center;width:min(92vw,620px);margin:12px auto;
    padding:30px 24px 26px;border-radius:24px;
    background:rgba(1,20,33,.50);border:1px solid rgba(0,190,205,.65);
    box-shadow:0 20px 60px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.025);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);color:#f3f5f6
  }
  .login-title{
    position:relative;margin:0 0 38px;padding-bottom:18px;text-align:center;
    color:rgba(248,249,250,.96);font-size:32px;line-height:1;font-weight:800;
    letter-spacing:.015em;text-transform:uppercase
  }
  .login-title::after{
    content:"";position:absolute;left:50%;bottom:0;width:54px;height:3px;
    border-radius:99px;transform:translateX(-50%);background:#10b7b9;opacity:.90
  }
  #loginCard .field{margin-bottom:28px}
  #loginCard label{
    margin:0 0 11px;color:rgba(247,248,249,.92);font-size:16px;font-weight:800;
    letter-spacing:.01em;text-transform:uppercase
  }
  #loginCard .input-wrap{position:relative}
  #loginCard input{
    width:100%;height:64px;border:1px solid rgba(174,190,198,.28);border-radius:14px;
    padding:0 56px 0 58px;color:#f5f7f8;font-size:17px;background:rgba(0,7,15,.22);
    box-shadow:none
  }
  #loginCard input::placeholder{color:rgba(229,234,237,.50);opacity:1}
  #loginCard input:focus{
    border-color:rgba(18,132,59,.95);box-shadow:0 0 0 3px rgba(18,132,59,.13);background:rgba(0,12,20,.34)
  }
  .field-icon{
    display:flex;position:absolute;left:18px;top:50%;width:24px;height:24px;
    transform:translateY(-50%);align-items:center;justify-content:center;color:#0fc4c8;pointer-events:none
  }
  .field-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
  .eye-toggle{
    display:flex;position:absolute;right:11px;top:50%;width:44px;height:44px;min-height:44px;padding:0;
    transform:translateY(-50%);align-items:center;justify-content:center;border:0;border-radius:50%;
    color:rgba(250,250,250,.92);background:transparent;cursor:pointer
  }
  .eye-toggle svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
  .eye-toggle:focus-visible{outline:2px solid rgba(18,132,59,.8);outline-offset:1px}

  #loginCard .primary{
    width:100%;min-height:64px;margin-top:2px;border-radius:14px;
    background:linear-gradient(180deg,#14964d 0%,#0b7839 100%);color:#fff;
    box-shadow:0 10px 25px rgba(3,82,38,.20);font-size:18px;font-weight:850;
    letter-spacing:.035em;text-transform:uppercase
  }
  #loginCard .primary:active{transform:translateY(1px)}
  #loginCard .status{margin-top:9px;min-height:18px;font-size:13px;color:#ffb3ad;text-align:center}
  #loginCard .status.ok{color:#7fd99b}

  .mobile-help{
    display:flex;align-self:end;justify-self:center;align-items:center;justify-content:center;
    gap:10px;width:100%;padding:8px 0 0;color:rgba(238,241,243,.58);
    font-size:13px;font-weight:650;letter-spacing:.005em;text-transform:uppercase;white-space:nowrap
  }
  .mobile-help-icon{
    display:grid;place-items:center;width:32px;height:32px;border:1.5px solid rgba(238,241,243,.58);
    border-radius:50%;font-size:20px;line-height:1;color:rgba(238,241,243,.66)
  }

  .session{
    width:calc(100% - 24px);max-width:560px;margin:12px auto;padding:12px 14px;
    border:1px solid rgba(255,255,255,.78);border-radius:16px;background:rgba(255,255,255,.96);
    box-shadow:0 10px 30px rgba(0,0,0,.20)
  }
  .ready,.admin{
    width:calc(100% - 24px);max-width:560px;margin:110px auto 24px;padding:22px 18px;border-radius:22px;
    background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.82);
    box-shadow:0 18px 48px rgba(0,0,0,.28)
  }
  .ready h2{font-size:30px}
  .ready p{font-size:16px}
  .ready .primary{width:100%;min-width:0}
  .ready .row{display:grid;grid-template-columns:1fr;gap:10px}
  .admin h2{font-size:30px}
}

@media(max-width:430px){
  .login-view.active{padding-left:14px;padding-right:14px}
  .mobile-brand{padding-top:clamp(32px,5.8svh,54px)}
  .mobile-logo{width:52px;height:52px;margin-bottom:20px}
  .mobile-brand-title{font-size:clamp(32px,9.2vw,40px)}
  #loginCard{width:100%;padding:27px 20px 23px;border-radius:22px}
  .login-title{font-size:30px;margin-bottom:32px}
  #loginCard .field{margin-bottom:24px}
  #loginCard input{height:60px;font-size:16px}
  #loginCard .primary{min-height:60px}
  .mobile-help{font-size:12px;gap:9px}
  .mobile-help-icon{width:30px;height:30px;font-size:18px}
}

@media(max-height:740px) and (max-width:900px){
  .login-view.active{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
  .mobile-brand{padding-top:18px}
  .mobile-logo{width:44px;height:44px;margin-bottom:13px}
  .mobile-brand-title{font-size:30px}
  #loginCard{padding:20px 18px 17px;margin:7px auto;border-radius:20px}
  .login-title{font-size:27px;margin-bottom:22px;padding-bottom:14px}
  #loginCard .field{margin-bottom:17px}
  #loginCard label{font-size:14px;margin-bottom:7px}
  #loginCard input{height:52px;font-size:15px}
  #loginCard .primary{min-height:52px;font-size:16px}
  #loginCard .status{min-height:14px;margin-top:6px}
  .mobile-help{font-size:11px;padding-top:4px}
  .mobile-help-icon{width:27px;height:27px;font-size:16px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="visual">
    <img src="./safety-walk-cover.png" alt="Safety Walk 1.0">
  </aside>

  <main class="panel">
    <div id="session" class="session">
      <div>
        <strong id="sessionName"></strong>
        <span id="sessionRole"></span>
      </div>
      <button id="logout" class="secondary">Log ud</button>
    </div>

    <div id="loginView" class="login-view active">
      <div class="mobile-brand" aria-hidden="true">
        <div class="mobile-logo">
          <svg viewBox="0 0 120 120" role="img" aria-label="Compass rose">
            <defs>
              <path id="logoTopArc" d="M 16 61 A 44 44 0 0 1 104 61"/>
              <path id="logoBottomArc" d="M 14 67 A 46 46 0 0 0 106 67"/>
            </defs>
            <g fill="none" stroke="rgba(242,244,246,.82)" stroke-width="1.5">
              <circle cx="60" cy="60" r="27" opacity=".7"/>
              <circle cx="60" cy="60" r="19" opacity=".38"/>
              <path d="M60 29 L66 52 L91 60 L66 68 L60 91 L54 68 L29 60 L54 52 Z" fill="rgba(242,244,246,.08)"/>
              <path d="M60 38 L63 56 L82 60 L63 64 L60 82 L57 64 L38 60 L57 56 Z"/>
              <path d="M60 31 L60 89 M31 60 L89 60" opacity=".62"/>
            </g>
            <g fill="rgba(242,244,246,.80)" font-family="Arial, sans-serif" font-weight="700" font-size="5.4" letter-spacing=".7">
              <text><textPath href="#logoTopArc" startOffset="50%" text-anchor="middle">NAVIGARE NECESSE EST,</textPath></text>
              <text><textPath href="#logoBottomArc" startOffset="50%" text-anchor="middle">VIVERE NON EST NECESSE</textPath></text>
            </g>
            <g fill="rgba(242,244,246,.78)" font-family="Arial, sans-serif" font-weight="800" font-size="6.5" text-anchor="middle">
              <text x="60" y="27">N</text><text x="94" y="62">E</text><text x="60" y="98">S</text><text x="26" y="62">W</text>
            </g>
          </svg>
        </div>
        <div class="mobile-brand-title">SAFETY WALK 1.0</div>
      </div>

      <section id="loginCard" class="card active">
        <h1 class="login-title">Log in</h1>

        <div class="field">
          <label for="email">Email / Username</label>
          <div class="input-wrap">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>

        <div class="field">
          <label for="password">Password</label>

            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v2"/></svg>
            </span>
            <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
            <button id="togglePassword" class="eye-toggle" type="button" aria-label="Show password">
              <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>

        <button id="login" class="primary">LOG IN &nbsp;→</button>

      <div class="mobile-help">

    <section id="readyCard" class="card ready">
      <h2>Safety Walk er klar</h2>

      <div class="field">

        <input id="newEmail" type="email" placeholder="peter@firma.dk">
      </div>

        <label for="newPassword">Midlertidig adgangskode</label>
        <input id="newPassword" type="password" placeholder="Mindst 8 tegn">
      </div>

      <div class="row">
        <button id="createUser" class="primary" style="width:auto">Opret bruger</button>
        <button id="back" class="secondary">Tilbage</button>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://hvgljbyethfwxajnrvvi.supabase.co";
const SUPABASE_KEY="sb_publishable_pMvJE0yUfBC9KhPl43WGrQ_dUCERa3c";
const APP_BUCKET='safety-app', APP_FILE='app-v137.html';

if (!window.supabase || !window.supabase.createClient) {
  const msg = document.getElementById('loginStatus');
  if (msg) msg.textContent = 'Kunne ikke indlæse login-systemet. Åbn siden fra GitHub Pages i Safari og prøv igen.';
  throw new Error('Supabase library was not loaded');
}

const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentProfile=null;

function status(id,msg,ok=false){
  const e=$(id);
  e.textContent=msg||'';
  e.className='status'+(ok?' ok':'');
}

function fmt(ts){
  if(!ts)return'Aldrig';
  try{
    return new Intl.DateTimeFormat('da-DK',{dateStyle:'short',timeStyle:'short'}).format(new Date(ts));
  }catch{
    return ts;
  }
}

function show(id){
  ['loginCard','readyCard','adminCard'].forEach(x=>$(x).classList.toggle('active',x===id));
  const loginView=$('loginView');
  if(loginView)loginView.classList.toggle('active',id==='loginCard');
}

function updateSession(){
  const s=$('session');
  if(currentProfile){
    $('sessionName').textContent=currentProfile.display_name||currentProfile.email;
    $('sessionRole').textContent=currentProfile.role==='admin'?'Administrator':'Bruger';
    s.classList.add('show');
    $('adminBtn').style.display=currentProfile.role==='admin'?'inline-block':'none';
  }else{
    s.classList.remove('show');
    $('adminBtn').style.display='none';
  }
}

async function loadOwnProfile(record=false){
  const {data:{user}}=await supabase.auth.getUser();
  if(!user)return null;

  const {data:profile,error}=await supabase
    .from('profiles')
    .select('id,email,display_name,role,active,last_login_at,login_count')
    .eq('id',user.id)
    .single();

  if(error)throw error;

  if(!profile.active){
    await supabase.auth.signOut();
    throw new Error('Din bruger er deaktiveret. Kontakt administrator.');
  }

  if(record){
    const {error:rpcError}=await supabase.rpc('record_login');
    if(rpcError)throw rpcError;

    const {data:r}=await supabase
      .from('profiles')
      .select('id,email,display_name,role,active,last_login_at,login_count')
      .eq('id',user.id)
      .single();

    return r||profile;
  }

  return profile;
}

const togglePassword=$('togglePassword');
if(togglePassword){
  togglePassword.onclick=()=>{
    const input=$('password');
    const showing=input.type==='text';
    input.type=showing?'password':'text';
    togglePassword.setAttribute('aria-label',showing?'Show password':'Hide password');
  };
}

$('login').onclick=async()=>{
  status('loginStatus','');

  const email=$('email').value.trim();
  const password=$('password').value;

  if(!email||!password){
    status('loginStatus','Indtast e-mail og adgangskode.');
    return;
  }

  $('login').disabled=true;
  status('loginStatus','Kontrollerer login…',true);

  try{
    const {error}=await supabase.auth.signInWithPassword({email,password});
    if(error)throw error;

    currentProfile=await loadOwnProfile(true);
    $('password').value='';
    updateSession();
    show('readyCard');
  }catch(err){
    await supabase.auth.signOut();
    currentProfile=null;
    updateSession();
    status('loginStatus',err.message||'Login mislykkedes.');
  }finally{
    $('login').disabled=false;
  }
};

$('logout').onclick=async()=>{
  await supabase.auth.signOut();
  currentProfile=null;
  updateSession();
  show('loginCard');
};

$('startApp').onclick=async()=>{
  status('readyStatus','Åbner Safety Walk...',true);

  const {data,error}=await supabase.storage
    .from(APP_BUCKET)
    .createSignedUrl(APP_FILE,60);

  if(error){
    status('readyStatus','Kunne ikke åbne Safety Walk: '+error.message);
    return;
  }

  try{
    const r=await fetch(data.signedUrl);
    if(!r.ok)throw new Error('HTTP '+r.status);

    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status('readyStatus','Kunne ikke indlæse Safety Walk: '+err.message);
  }
};

$('adminBtn').onclick=async()=>{
  if(currentProfile?.role!=='admin')return;
  show('adminCard');
  await refreshUsers();
};

$('back').onclick=()=>show('readyCard');

async function refreshUsers(){
  status('adminStatus','Henter brugere…',true);

  const {data,error}=await supabase
    .from('profiles')
    .select('id,email,display_name,role,active,last_login_at,login_count,created_at')
    .order('last_login_at',{ascending:false,nullsFirst:false});

  if(error){
    status('adminStatus',error.message);
    return;
  }

  renderUsers(data||[]);
  status('adminStatus',(data||[]).length+' bruger(e) fundet.',true);
}

function renderUsers(users){
  const box=$('userList');
  box.innerHTML='';

  for(const u of users){
    const row=document.createElement('div');
    row.className='user'+(u.active?'':' disabled');

    const info=document.createElement('div');
    info.innerHTML=
      '<strong>'+esc(u.display_name||u.email)+'</strong>'+
      '<small>'+esc(u.email)+' · '+(u.role==='admin'?'Administrator':'Bruger')+(u.active?'':' · Deaktiveret')+'</small>'+
      '<small><b>Seneste login:</b> '+esc(fmt(u.last_login_at))+'</small>'+
      '<small><b>Antal logins:</b> '+Number(u.login_count||0)+'</small>';

    const acts=document.createElement('div');
    acts.className='actions';

    if(u.role!=='admin'){
      const t=document.createElement('button');
      t.className=u.active?'warning':'secondary';
      t.textContent=u.active?'Deaktivér':'Aktivér';
      t.onclick=()=>adminAction({action:'set_active',user_id:u.id,active:!u.active},refreshUsers);
      acts.appendChild(t);

      const p=document.createElement('button');
      p.className='secondary';
      p.textContent='Nyt password';
      p.onclick=()=>{
        const np=prompt('Nyt password (mindst 8 tegn):');
        if(np===null)return;
        if(np.length<8){
          alert('Password skal være mindst 8 tegn.');
          return;
        }
        adminAction(
          {action:'reset_password',user_id:u.id,password:np},
          ()=>alert('Password er ændret.')
        );
      };
      acts.appendChild(p);

      const d=document.createElement('button');
      d.className='danger';
      d.textContent='Slet';
      d.onclick=()=>{
        if(confirm('Slet '+(u.display_name||u.email)+' permanent?')){
          adminAction({action:'delete',user_id:u.id},refreshUsers);
        }
      };
      acts.appendChild(d);
    }

    row.appendChild(info);
    row.appendChild(acts);
    box.appendChild(row);
  }
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c]));
}

async function adminAction(body,success){
  status('adminStatus','Arbejder…',true);

  const {data,error}=await supabase.functions.invoke('admin-users',{body});

  if(error){
    status('adminStatus',error.message||'Edge Function fejlede.');
    return;
  }

  if(data?.error){
    status('adminStatus',data.error);
    return;
  }

  status('adminStatus',data?.message||'Udført.',true);

  if(success)await success(data);
}

$('createUser').onclick=async()=>{
  const display_name=$('newName').value.trim();
  const email=$('newEmail').value.trim().toLowerCase();
  const password=$('newPassword').value;

  if(!display_name||!email||password.length<8){
    status('adminStatus','Udfyld navn og e-mail. Password skal være mindst 8 tegn.');
    return;
  }

  await adminAction(
    {action:'create',display_name,email,password},
    async()=>{
      $('newName').value='';
      $('newEmail').value='';
      $('newPassword').value='';
      await refreshUsers();
    }
  );
};

async function boot(){
  const {data:{session}}=await supabase.auth.getSession();

  if(!session){
    show('loginCard');
    return;
  }

  try{
    currentProfile=await loadOwnProfile(false);
    updateSession();
    show('readyCard');
  }catch{
    await supabase.auth.signOut();
    currentProfile=null;
    updateSession();
    show('loginCard');
  }
}

boot();
</script>
