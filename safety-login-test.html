<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06110f">
<title>HSE Safety Walk – Login</title>
<style>
:root{
  --green:#12843b;
  --green-dark:#0b6a2f;
  --ink:#111820;
  --mut:#6f7780;
  --line:#dfe4e8;
  --bg:#f4f6f7;
  --red:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
body{display:grid;place-items:center;padding:18px}
.shell{
  width:min(1280px,100%);
  min-height:760px;
  background:#fff;
  border:1px solid #d9dfe3;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 22px 60px rgba(0,0,0,.14);
  display:grid;
  grid-template-columns:minmax(460px,1fr) minmax(520px,1fr);
}
.visual{
  position:relative;
  min-height:760px;
  background:#030808;
  overflow:hidden;
}
.visual img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.panel{
  min-height:760px;
  padding:70px 74px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:#fff;
}
.card{display:none}
.card.active{display:block}
h1,h2,h3,p{margin-top:0}
.login-title{
  font-size:56px;
  line-height:1;
  margin-bottom:42px;
  font-weight:800;
  letter-spacing:-1px;
}
label{
  display:block;
  font-size:18px;
  font-weight:700;
  margin:0 0 10px;
}
.field{margin-bottom:26px}
.input-wrap{position:relative}
input{
  width:100%;
  height:68px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 18px;
  font-size:18px;
  outline:none;
  background:#fff;
}
input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(18,132,59,.10)
}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
button{
  border:0;
  border-radius:14px;
  min-height:62px;
  padding:0 24px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}
.primary{
  width:100%;
  background:linear-gradient(180deg,var(--green),var(--green-dark));
  color:#fff;
}
.secondary{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
}
.warning{
  background:#fff7e9;
  color:#8a5300;
  border:1px solid #ecd2a5;
}
.danger{
  background:#fff1ef;
  color:var(--red);
  border:1px solid #efc1ba;
}
.status{
  min-height:24px;
  margin-top:14px;
  font-size:15px;
  font-weight:700;
  color:var(--red);
}
.status.ok{color:var(--green-dark)}
.session{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding-bottom:24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line);
}
.session.show{display:flex}
.session strong{font-size:18px}
.session span{display:block;color:var(--mut);font-size:14px;margin-top:3px}
.session button{min-height:44px;font-size:15px;padding:0 16px}
.ready h2{font-size:42px;margin-bottom:12px}
.ready p{font-size:18px;color:var(--mut);margin-bottom:28px}
.ready .row{margin-top:0}
.ready .primary{width:auto;min-width:260px}
.admin h2{font-size:38px;margin-bottom:22px}
.userlist{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  margin:0 0 26px;
}
.user{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  padding:14px;
  border-bottom:1px solid var(--line);
}
.user:last-child{border-bottom:0}
.user.disabled{background:#fafafa;opacity:.62}
.user small{display:block;color:var(--mut);margin-top:4px}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.actions button{min-height:36px;height:36px;padding:0 10px;font-size:12px}
.admin .field{margin-bottom:18px}
.admin input{height:54px;font-size:16px}
.admin label{font-size:15px}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
@media(max-width:900px){
  body{padding:0;background:#fff}
  .shell{grid-template-columns:1fr;border-radius:0;min-height:100vh;border:0}
  .visual{min-height:48vh}
  .visual img{height:48vh}
  .panel{min-height:52vh;padding:34px 28px;justify-content:flex-start}
  .login-title{font-size:42px;margin-bottom:28px}
  input{height:60px}
  .ready h2{font-size:34px}
}
@media(max-width:560px){
  .visual{min-height:43vh}
  .visual img{height:43vh}
  .panel{min-height:57vh;padding:28px 20px}
  .login-title{font-size:38px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="visual">
    <img src="./safety-walk-cover.png" alt="Safety Walk 1.0">
  </aside>

  <main class="panel">
    <div id="session" class="session">
      <div>
        <strong id="sessionName"></strong>
        <span id="sessionRole"></span>
      </div>
      <button id="logout" class="secondary">Log ud</button>
    </div>

    <section id="loginCard" class="card active">
      <h1 class="login-title">Log ind</h1>

      <div class="field">
        <label for="email">E-mail / brugernavn</label>
        <div class="input-wrap">
          <input id="email" type="email" autocomplete="username" placeholder="Indtast e-mail eller brugernavn">
        </div>
      </div>

      <div class="field">
        <label for="password">Adgangskode</label>
        <div class="input-wrap">
          <input id="password" type="password" autocomplete="current-password" placeholder="Indtast adgangskode">
        </div>
      </div>

      <button id="login" class="primary">Log ind</button>
      <div id="loginStatus" class="status"></div>
    </section>

    <section id="readyCard" class="card ready">
      <h2>Safety Walk er klar</h2>
      <p>Du er logget ind.</p>
      <div class="row">
        <button id="startApp" class="primary">Start Safety Walk</button>
        <button id="adminBtn" class="secondary" style="display:none">Brugere</button>
      </div>
      <div id="readyStatus" class="status"></div>
    </section>

    <section id="adminCard" class="card admin">
      <h2>Brugere</h2>
      <div id="adminStatus" class="status"></div>
      <div id="userList" class="userlist"></div>

      <hr>

      <div class="field">
        <label for="newName">Navn</label>
        <input id="newName" placeholder="Peter Jensen">
      </div>
      <div class="field">
        <label for="newEmail">E-mail</label>
        <input id="newEmail" type="email" placeholder="peter@firma.dk">
      </div>
      <div class="field">
        <label for="newPassword">Midlertidig adgangskode</label>
        <input id="newPassword" type="password" placeholder="Mindst 8 tegn">
      </div>

      <div class="row">
        <button id="createUser" class="primary" style="width:auto">Opret bruger</button>
        <button id="back" class="secondary">Tilbage</button>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL="https://hvgljbyethfwxajnrvvi.supabase.co";
const SUPABASE_KEY="sb_publishable_pMvJE0yUfBC9KhPl43WGrQ_dUCERa3c";
const APP_BUCKET='safety-app', APP_FILE='app-v137.html';

const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentProfile=null;

function status(id,msg,ok=false){
  const e=$(id);
  e.textContent=msg||'';
  e.className='status'+(ok?' ok':'');
}

function fmt(ts){
  if(!ts)return'Aldrig';
  try{
    return new Intl.DateTimeFormat('da-DK',{dateStyle:'short',timeStyle:'short'}).format(new Date(ts));
  }catch{
    return ts;
  }
}

function show(id){
  ['loginCard','readyCard','adminCard'].forEach(x=>$(x).classList.toggle('active',x===id));
}

function updateSession(){
  const s=$('session');
  if(currentProfile){
    $('sessionName').textContent=currentProfile.display_name||currentProfile.email;
    $('sessionRole').textContent=currentProfile.role==='admin'?'Administrator':'Bruger';
    s.classList.add('show');
    $('adminBtn').style.display=currentProfile.role==='admin'?'inline-block':'none';
  }else{
    s.classList.remove('show');
    $('adminBtn').style.display='none';
  }
}

async function loadOwnProfile(record=false){
  const {data:{user}}=await supabase.auth.getUser();
  if(!user)return null;

  const {data:profile,error}=await supabase
    .from('profiles')
    .select('id,email,display_name,role,active,last_login_at,login_count')
    .eq('id',user.id)
    .single();

  if(error)throw error;

  if(!profile.active){
    await supabase.auth.signOut();
    throw new Error('Din bruger er deaktiveret. Kontakt administrator.');
  }

  if(record){
    const {error:rpcError}=await supabase.rpc('record_login');
    if(rpcError)throw rpcError;

    const {data:r}=await supabase
      .from('profiles')
      .select('id,email,display_name,role,active,last_login_at,login_count')
      .eq('id',user.id)
      .single();

    return r||profile;
  }

  return profile;
}

$('login').onclick=async()=>{
  status('loginStatus','');

  const email=$('email').value.trim();
  const password=$('password').value;

  if(!email||!password){
    status('loginStatus','Indtast e-mail og adgangskode.');
    return;
  }

  $('login').disabled=true;
  status('loginStatus','Kontrollerer login…',true);

  try{
    const {error}=await supabase.auth.signInWithPassword({email,password});
    if(error)throw error;

    currentProfile=await loadOwnProfile(true);
    $('password').value='';
    updateSession();
    show('readyCard');
  }catch(err){
    await supabase.auth.signOut();
    currentProfile=null;
    updateSession();
    status('loginStatus',err.message||'Login mislykkedes.');
  }finally{
    $('login').disabled=false;
  }
};

$('logout').onclick=async()=>{
  await supabase.auth.signOut();
  currentProfile=null;
  updateSession();
  show('loginCard');
};

$('startApp').onclick=async()=>{
  status('readyStatus','Åbner Safety Walk...',true);

  const {data,error}=await supabase.storage
    .from(APP_BUCKET)
    .createSignedUrl(APP_FILE,60);

  if(error){
    status('readyStatus','Kunne ikke åbne Safety Walk: '+error.message);
    return;
  }

  try{
    const r=await fetch(data.signedUrl);
    if(!r.ok)throw new Error('HTTP '+r.status);

    const html=await r.text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status('readyStatus','Kunne ikke indlæse Safety Walk: '+err.message);
  }
};

$('adminBtn').onclick=async()=>{
  if(currentProfile?.role!=='admin')return;
  show('adminCard');
  await refreshUsers();
};

$('back').onclick=()=>show('readyCard');

async function refreshUsers(){
  status('adminStatus','Henter brugere…',true);

  const {data,error}=await supabase
    .from('profiles')
    .select('id,email,display_name,role,active,last_login_at,login_count,created_at')
    .order('last_login_at',{ascending:false,nullsFirst:false});

  if(error){
    status('adminStatus',error.message);
    return;
  }

  renderUsers(data||[]);
  status('adminStatus',(data||[]).length+' bruger(e) fundet.',true);
}

function renderUsers(users){
  const box=$('userList');
  box.innerHTML='';

  for(const u of users){
    const row=document.createElement('div');
    row.className='user'+(u.active?'':' disabled');

    const info=document.createElement('div');
    info.innerHTML=
      '<strong>'+esc(u.display_name||u.email)+'</strong>'+
      '<small>'+esc(u.email)+' · '+(u.role==='admin'?'Administrator':'Bruger')+(u.active?'':' · Deaktiveret')+'</small>'+
      '<small><b>Seneste login:</b> '+esc(fmt(u.last_login_at))+'</small>'+
      '<small><b>Antal logins:</b> '+Number(u.login_count||0)+'</small>';

    const acts=document.createElement('div');
    acts.className='actions';

    if(u.role!=='admin'){
      const t=document.createElement('button');
      t.className=u.active?'warning':'secondary';
      t.textContent=u.active?'Deaktivér':'Aktivér';
      t.onclick=()=>adminAction({action:'set_active',user_id:u.id,active:!u.active},refreshUsers);
      acts.appendChild(t);

      const p=document.createElement('button');
      p.className='secondary';
      p.textContent='Nyt password';
      p.onclick=()=>{
        const np=prompt('Nyt password (mindst 8 tegn):');
        if(np===null)return;
        if(np.length<8){
          alert('Password skal være mindst 8 tegn.');
          return;
        }
        adminAction(
          {action:'reset_password',user_id:u.id,password:np},
          ()=>alert('Password er ændret.')
        );
      };
      acts.appendChild(p);

      const d=document.createElement('button');
      d.className='danger';
      d.textContent='Slet';
      d.onclick=()=>{
        if(confirm('Slet '+(u.display_name||u.email)+' permanent?')){
          adminAction({action:'delete',user_id:u.id},refreshUsers);
        }
      };
      acts.appendChild(d);
    }

    row.appendChild(info);
    row.appendChild(acts);
    box.appendChild(row);
  }
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c]));
}

async function adminAction(body,success){
  status('adminStatus','Arbejder…',true);

  const {data,error}=await supabase.functions.invoke('admin-users',{body});

  if(error){
    status('adminStatus',error.message||'Edge Function fejlede.');
    return;
  }

  if(data?.error){
    status('adminStatus',data.error);
    return;
  }

  status('adminStatus',data?.message||'Udført.',true);

  if(success)await success(data);
}

$('createUser').onclick=async()=>{
  const display_name=$('newName').value.trim();
  const email=$('newEmail').value.trim().toLowerCase();
  const password=$('newPassword').value;

  if(!display_name||!email||password.length<8){
    status('adminStatus','Udfyld navn og e-mail. Password skal være mindst 8 tegn.');
    return;
  }

  await adminAction(
    {action:'create',display_name,email,password},
    async()=>{
      $('newName').value='';
      $('newEmail').value='';
      $('newPassword').value='';
      await refreshUsers();
    }
  );
};

async function boot(){
  const {data:{session}}=await supabase.auth.getSession();

  if(!session){
    show('loginCard');
    return;
  }

  try{
    currentProfile=await loadOwnProfile(false);
    updateSession();
    show('readyCard');
  }catch{
    await supabase.auth.signOut();
    currentProfile=null;
    updateSession();
    show('loginCard');
  }
}

boot();
</script>
</body>
</html>
