name: Safety Walk 2.0 live release verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [safety-login.html, offline-sw.js, index.html, sw2/**, .github/workflows/sw2-live-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify simple release code
        run: |
          grep -q 'data-sw2-release="2.0-simple"' safety-login.html
          grep -q 'sw2/vendor/supabase-client.mjs' safety-login.html
          grep -q 'sw2-license-simple' sw2/config.mjs
          for f in sw2/*.mjs sw2/vendor/*.mjs; do node --check "$f"; done
          node --check offline-sw.js
      - name: Verify deployed release assets
        run: |
          set -eu
          base='https://hse-safety.github.io/HSE-Safety-Walk'
          for n in $(seq 1 30); do
            curl -fsSL --max-time 15 "$base/safety-login.html?release=${GITHUB_SHA}" -o /tmp/login.html || true
            if grep -q 'data-sw2-release="2.0-simple"' /tmp/login.html 2>/dev/null; then break; fi
            sleep 5
          done
          grep -q 'data-sw2-release="2.0-simple"' /tmp/login.html
          curl -fsSL --max-time 30 "$base/sw2/config.mjs?release=${GITHUB_SHA}" | grep -q 'sw2-license-simple'
          curl -fsSL --max-time 30 "$base/sw2/auth.mjs?release=${GITHUB_SHA}" | grep -q './vendor/supabase-client.mjs'
          curl -fsSL --max-time 30 "$base/sw2/vendor/supabase-client.mjs?release=${GITHUB_SHA}" | grep -q 'createClient'
          curl -fsSL --max-time 30 "$base/offline-sw.js?release=${GITHUB_SHA}" | grep -q 'licensed-simple-v5'
          curl -fsSL --max-time 30 "$base/sw2/report-viewer-v2.html" | grep -q 'Beskyttet rapport'
          curl -fsSL --max-time 30 'https://hvgljbyethfwxajnrvvi.supabase.co/functions/v1/sw2-license-simple?action=health' | grep -q '"ready":true'
          echo 'PASS: simple release login, local auth dependencies, offline worker, report viewer and original private module preparation are live'
