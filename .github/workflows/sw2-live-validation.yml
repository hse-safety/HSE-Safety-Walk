name: Safety Walk 2.0 live release verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [safety-login.html, offline-sw.js, index.html, sw2/**, .github/workflows/sw2-live-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify simple release code
        run: |
          grep -q 'data-sw2-release="2.0-simple"' safety-login.html
          grep -q 'sw2/client.mjs' safety-login.html
          grep -q 'sw2-license-simple' sw2/config.mjs
          for f in sw2/*.mjs sw2/vendor/*.mjs; do node --check "$f"; done
          node --check offline-sw.js
      - name: Verify deployed release assets
        run: |
          set -eu
          base='https://hse-safety.github.io/HSE-Safety-Walk'
          # Wait for Pages to publish this worker, rather than checking an obsolete version.
          for n in $(seq 1 30); do
            if curl -fsSL --max-time 15 "$base/offline-sw.js?release=${GITHUB_SHA}" -o /tmp/worker.js && cmp -s offline-sw.js /tmp/worker.js; then break; fi
            sleep 5
          done
          cmp offline-sw.js /tmp/worker.js
          check_asset() {
            echo "Checking $1"
            grep -Fq "$2" "$1" || { echo "Outdated verification marker for $1"; return 1; }
            for attempt in $(seq 1 12); do
              if curl -fsSL --max-time 15 "$base/$1?release=${GITHUB_SHA}&attempt=$attempt" -o /tmp/asset && cmp -s "$1" /tmp/asset; then return 0; fi
              sleep 5
            done
            echo "Published file does not match this release: $1"
            return 1
          }
          check_asset safety-login.html 'data-sw2-release="2.0-simple"'
          check_asset sw2/config.mjs 'sw2-license-simple'
          check_asset sw2/auth.mjs './client.mjs'
          check_asset sw2/client.mjs './vendor/supabase-client.mjs'
          check_asset sw2/vendor/supabase-client.mjs 'createClient'
          check_asset sw2/report-viewer-v2.html 'Safety Walk 2.0 – Protected Reports'
          curl -fsSL --max-time 30 'https://hvgljbyethfwxajnrvvi.supabase.co/functions/v1/sw2-license-simple?action=health' -o /tmp/health.json
          grep -Fq '"ready":true' /tmp/health.json
          echo 'PASS: current release worker, login, auth dependencies, report viewer and module service are live'
