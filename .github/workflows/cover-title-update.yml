name: Update cover title
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          image=Image.open("safety-walk-cover.png").convert("RGB")
          w,h=image.size
          draw=ImageDraw.Draw(image)
          draw.rectangle((int(w*.77),int(h*.69),w,int(h*.79)),fill="#001e24")
          image.save("safety-walk-cover.png")
          PY
      - run: |
          git config user.name cover-updater
          git config user.email updater@users.noreply.github.com
          git add safety-walk-cover.png
          git commit -m "Remove obsolete version number from cover"
          git push
