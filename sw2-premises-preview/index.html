<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safety Walk 2.0 – Facility TEST</title><style>body{background:#eef3f7;color:#173048;font:17px system-ui;margin:0;padding:20px}main{max-width:430px;margin:8vh auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 20px #1232}label{display:block;margin-top:14px}input{display:block;box-sizing:border-box;width:100%;padding:13px;font:inherit;margin-top:5px}button{background:#006970;color:#fff;border:0;border-radius:8px;padding:13px 20px;margin-top:22px;font:inherit;cursor:pointer}#status{min-height:2em}</style></head><body><main><h1>Office / Warehouse Facility 2.0 · TEST</h1><p>Beskyttet test af Office Facility og Warehouse Facility. Safety Walk 1.0 er uændret.</p><form id="loginForm"><label>E-mail<input type="email" id="email" autocomplete="username" required></label><label>Adgangskode<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">Åbn Office / Warehouse Facility TEST</button></form><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://hvgljbyethfwxajnrvvi.supabase.co','sb_publishable_pMvJE0yUfBC9KhPl43WGrQ_dUCERa3c');
const api='https://hvgljbyethfwxajnrvvi.supabase.co/functions/v1/sw2-premises-preview';
const form=document.getElementById('loginForm'),notice=document.getElementById('status');
form.addEventListener('submit',async event=>{
event.preventDefault();notice.textContent='Kontrollerer Facility-adgang…';
const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
const {data,error}=await sb.auth.signInWithPassword({email,password});document.getElementById('password').value='';
if(error||!data.session){notice.textContent='Login mislykkedes.';return}
try{
 const response=await fetch(api,{headers:{Authorization:'Bearer '+data.session.access_token},cache:'no-store'});
 if(!response.ok)throw Error('Facility-adgang afvist ('+response.status+').');
 let html=await response.text();
 if(html.length<350000||!html.toLowerCase().includes('</head>'))throw Error('Ugyldig privat Facility-fil.');
 const head=`<style id="sw2-premises-lock-style">html:not(.sw2-premises-approved) body{visibility:hidden!important}html:not(.sw2-premises-approved)::after{content:'Office / Warehouse Facility 2.0 – adgang kontrolleres';position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;text-align:center;font:600 18px system-ui;background:#f4f6f7;color:#173048}html.sw2-premises-denied::after{content:'Adgang til Office / Warehouse Facility 2.0 er ikke godkendt. Kontakt administrator.'}</style><script type="module" src="./sw2-premises-gate.mjs"><\/script>`;
 html=html.replace(/<\/head>/i,head+'</head>');
 const permission=await fetch(api+'?check=1',{headers:{Authorization:'Bearer '+data.session.access_token},cache:'no-store'});
 if(!permission.ok)throw Error('Facility-adgang afvist ('+permission.status+').');
 const grant=await permission.json();
 if(grant.approved!==true||!(grant.access?.office===true||grant.access?.warehouse===true))throw Error('Facility-adgang mangler.');
 const displayName=data.user.user_metadata?.full_name||data.user.email;
 const identity={id:data.user.id,user_id:data.user.id,userId:data.user.id,email:data.user.email,name:displayName,displayName,role:'user',access:{onsite:false,office:grant.access.office===true,warehouse:grant.access.warehouse===true}};
 // document.open() can replace document execution state. Ensure the unchanged
 // Facility access-control script sees its identity before it executes.
 const injected='<script>window.__HSE_SW_IDENTITY='+JSON.stringify(identity).replace(/</g,'\\u003c')+';<\\/script>';
 html=html.replace(/<head(\\s[^>]*)?>/i,matched=>matched+injected);
 window.__HSE_SW_IDENTITY=identity;
 document.open();document.write(html);document.close();
}catch(e){notice.textContent=e.message}
});
</script></body></html>
