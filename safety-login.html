<!doctype html>
<html data-sw2-release="2.0-simple" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Safety Walk">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#00131f">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=150">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=150">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon.png?v=150">
<link rel="manifest" href="./manifest.webmanifest?v=150">
<title>SAFETY WALK 2.0 – Login</title>
<link rel="canonical" href="./safety-login.html">
<!-- SAFETY WALK 2.0 production login: On-Site and KVI Premises access control enabled. -->
<style>
:root{
  --green:#12843b;
  --green-dark:#0b6a2f;
  --ink:#111820;
  --mut:#6f7780;
  --line:#dfe4e8;
  --bg:#f4f6f7;
  --red:#b42318;
}
*{box-sizing:border-box}
html.login-locked,html.login-locked body{height:100%;overflow:hidden;overscroll-behavior:none}
html.login-locked body{-webkit-overflow-scrolling:auto}
html.login-locked .shell,html.login-locked .panel,html.login-locked .login-view{overscroll-behavior:none}
html.login-locked .login-view,html.login-locked .mobile-brand,html.login-locked .mobile-help,html.login-locked #loginCard{
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none
}
html.login-locked input{-webkit-user-select:text;user-select:text}
html,body{margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
body{display:grid;place-items:center;padding:18px}
.shell{
  width:min(1280px,100%);
  min-height:760px;
  background:#fff;
  border:1px solid #d9dfe3;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 22px 60px rgba(0,0,0,.14);
  display:grid;
  grid-template-columns:minmax(460px,1fr) minmax(520px,1fr);
}
.visual{
  position:relative;
  min-height:760px;
  overflow:hidden;
  background:#00131f;
}
.desktop-brand{
  position:absolute;
  inset:0;
  display:block;
}
.desktop-brand-art{
  width:100%;
  height:100%;
  min-height:760px;
  object-fit:cover;
  object-position:center center;
  display:block;
}
.panel{
  min-height:760px;
  padding:70px 74px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:#fff;
}
.card{display:none}
.card.active{display:block}
h1,h2,h3,p{margin-top:0}
.login-title{
  font-size:56px;
  line-height:1;
  margin-bottom:42px;
  font-weight:800;
  letter-spacing:-1px;
}
label{
  display:block;
  font-size:18px;
  font-weight:700;
  margin:0 0 10px;
}
.field{margin-bottom:26px}
.input-wrap{position:relative}
input{
  width:100%;
  height:68px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 18px;
  font-size:18px;
  outline:none;
  background:#fff;
}
input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(18,132,59,.10)
}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
button{
  border:0;
  border-radius:14px;
  min-height:62px;
  padding:0 24px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}
.primary{
  width:100%;
  background:linear-gradient(180deg,var(--green),var(--green-dark));
  color:#fff;
}
.secondary{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
}
.warning{
  background:#fff7e9;
  color:#8a5300;
  border:1px solid #ecd2a5;
}
.promote-admin{
  background:#edf8f0;
  color:var(--green-dark);
  border:1px solid #b9dfc4;
}
.danger{
  background:#fff1ef;
  color:var(--red);
  border:1px solid #efc1ba;
}
.status{
  min-height:24px;
  margin-top:14px;
  font-size:15px;
  font-weight:700;
  color:var(--red);
}
.status.ok{color:var(--green-dark)}
.session{
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding-bottom:24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--line);
}
.session.show{display:flex}
.session strong{font-size:18px}
.session span{display:none}
.session button{min-height:44px;font-size:15px;padding:0 16px}
.ready h2{font-size:42px;margin-bottom:12px}
.ready p{font-size:18px;color:var(--mut);margin-bottom:28px}
.ready .row{margin-top:0}
.ready .primary{width:auto;min-width:260px}
.admin h2,.password-card h2{font-size:38px;margin-bottom:22px}

.ready-module-row{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  width:100%;
  margin:0 0 16px;
}
.ready-module-row .primary{
  width:100%;
  min-width:0;
}
.access-create{
  margin:2px 0 22px;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#f8fafb;
}
.access-create-title,
.user-access-title{
  display:block;
  margin:0 0 10px;
  font-size:13px;
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--ink);
}
.access-options{
  display:flex;
  flex-wrap:wrap;
  gap:10px 18px;
  align-items:center;
}
.access-option{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin:0;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.access-option input{
  width:18px;
  height:18px;
  min-height:0;
  padding:0;
  margin:0;
  accent-color:var(--green);
}
.user-info{min-width:0}
.user-access{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #edf0f2;
}
.user-access .access-options{gap:8px 14px}
.user-access .access-option{font-size:12px}
.user-access .access-option input{width:16px;height:16px}
.user-access-note{
  margin-top:6px;
  font-size:11px;
  color:var(--mut);
}
.developer-protection-notice{margin-top:12px;color:#b42318;font-size:13px;line-height:1.45;font-weight:800}
.module-hidden{display:none !important}
@media(max-width:560px){
  .ready-module-row{grid-template-columns:1fr}
}

/* Admin storage meter — current project storage against Free Plan quotas. */
.usage-card{
  margin:0 0 22px;
  padding:16px 16px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#f8fafb;
}
.usage-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
.usage-title{
  font-size:13px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink);
}
.usage-subtitle{
  margin-top:3px;
  font-size:12px;
  line-height:1.35;
  color:var(--mut);
}
.usage-percent{
  flex:0 0 auto;
  font-size:24px;
  line-height:1;
  font-weight:850;
  color:var(--green-dark);
}
.usage-track{
  height:12px;
  overflow:hidden;
  border-radius:999px;
  background:#e4eaed;
  box-shadow:inset 0 1px 2px rgba(18,43,54,.10);
}
.usage-bar{
  width:0;
  height:100%;
  border-radius:inherit;
  background:var(--green);
  transition:width .28s ease;
}
.usage-card.level-watch .usage-bar{background:#d79a18}
.usage-card.level-warning .usage-bar{background:#c66a12}
.usage-card.level-critical .usage-bar{background:var(--red)}
.usage-card.level-watch .usage-percent{color:#9a6900}
.usage-card.level-warning .usage-percent{color:#a65108}
.usage-card.level-critical .usage-percent{color:var(--red)}
.usage-details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px 18px;
  margin-top:12px;
}
.usage-detail{
  min-width:0;
  font-size:12px;
  line-height:1.4;
  color:var(--mut);
}
.usage-detail strong{
  display:block;
  margin-top:1px;
  font-size:13px;
  color:var(--ink);
}
.usage-foot{
  margin-top:10px;
  font-size:11px;
  line-height:1.4;
  color:var(--mut);
}
.usage-unavailable .usage-track{opacity:.45}
.usage-unavailable .usage-percent{font-size:14px;color:var(--mut)}
@media(max-width:430px){
  .usage-details{grid-template-columns:1fr}
}

.password-card .field{margin-bottom:18px}
.password-card input{height:54px;font-size:16px}
.password-card label{font-size:15px}
.userlist{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  margin:0 0 26px;
}
.user{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  padding:14px;
  border-bottom:1px solid var(--line);
}
.user:last-child{border-bottom:0}
.user.disabled{background:#fafafa;opacity:.62}
.user small{display:block;color:var(--mut);margin-top:4px}
/* User Management: keep action controls in a dedicated vertical column so they never cover Inspection Access. */
.actions{
  display:flex;
  flex-direction:column;
  flex-wrap:nowrap;
  gap:8px;
  justify-content:flex-start;
  align-items:stretch;
  width:168px;
  align-self:start;
}
.actions button{
  width:100%;
  min-height:40px;
  height:auto;
  padding:9px 12px;
  font-size:12px;
  line-height:1.15;
  white-space:normal;
}
.user{
  grid-template-columns:minmax(0,1fr) 168px;
  gap:18px;
  align-items:start;
}
.user-access-note{line-height:1.4;max-width:100%}
@media(max-width:480px){
  .user{grid-template-columns:1fr;gap:14px}
  .actions{width:100%}
}
.admin .field{margin-bottom:18px}
.admin input{height:54px;font-size:16px}
.admin label{font-size:15px}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}

.login-view{display:contents}
.login-view:not(.active){display:none}
.mobile-brand,.mobile-help{display:none}
.field-icon,.eye-toggle{display:none}


/* Desktop browser 100% zoom:
   keep the left Safety Walk artwork fitted to the visible browser height,
   independent of the height of User Management on the right. */
@media(min-width:901px){
  body{
    display:block;
    padding:18px;
  }
  .shell{
    width:min(1280px,calc(100vw - 36px));
    min-height:calc(100vh - 36px);
    margin:0 auto;
    align-items:start;
    background:#00131f;
  }
  .visual{
    height:calc(100vh - 36px);
    min-height:0;
    align-self:start;
    overflow:hidden;
  }
  .desktop-brand{
    height:100%;
  }
  .desktop-brand-art{
    width:100%;
    height:100%;
    min-height:0;
    object-fit:cover;
    object-position:center center;
  }
  .panel{
    min-height:calc(100vh - 36px);
    box-sizing:border-box;
    background:#fff;
  }
}

@media(max-width:900px){

  .desktop-brand{display:none}

  /* iPhone: login is locked; all authenticated screens must remain freely scrollable. */
  html:not(.login-locked),
  html:not(.login-locked) body{
    height:auto !important;
    min-height:100% !important;
    overflow-y:auto !important;
    overflow-x:hidden !important;
    overscroll-behavior-y:auto !important;
    -webkit-overflow-scrolling:touch !important;
    touch-action:pan-y !important;
  }
  html:not(.login-locked) .shell{
    height:auto !important;
    min-height:100svh !important;
    overflow:visible !important;
  }
  html:not(.login-locked) .panel{
    height:auto !important;
    min-height:100svh !important;
    overflow:visible !important;
    padding-bottom:calc(110px + env(safe-area-inset-bottom)) !important;
    touch-action:pan-y !important;
  }
  html:not(.login-locked) .ready,
  html:not(.login-locked) .admin,
  html:not(.login-locked) .password-card{
    touch-action:pan-y !important;
  }
  html:not(.login-locked) .admin{
    margin-top:28px !important;
    margin-bottom:24px !important;
    overflow:visible !important;
  }

  html,body{width:100%;min-height:100%;background:#00131f}
  body{display:block;padding:0;min-height:100svh;overflow-x:hidden}
  .shell{
    position:relative;display:block;width:100%;min-height:100svh;
    border:0;border-radius:0;box-shadow:none;overflow:hidden;background:#00131f
  }
  .visual{
    position:fixed;inset:0;z-index:0;min-height:100svh;height:100svh;overflow:hidden;
    background:
      radial-gradient(circle at -8% -4%,transparent 0 18%,rgba(0,190,210,.20) 18.1% 18.35%,transparent 18.5% 23.5%,rgba(0,190,210,.18) 23.6% 23.85%,transparent 24% 29%,rgba(0,190,210,.15) 29.1% 29.35%,transparent 29.5% 35%,rgba(0,190,210,.11) 35.1% 35.35%,transparent 35.5%),
      radial-gradient(circle at 111% 101%,transparent 0 26%,rgba(0,190,210,.18) 26.1% 26.35%,transparent 26.5% 32%,rgba(0,190,210,.15) 32.1% 32.35%,transparent 32.5% 38%,rgba(0,190,210,.12) 38.1% 38.35%,transparent 38.5% 44%,rgba(0,190,210,.09) 44.1% 44.35%,transparent 44.5%),
      linear-gradient(155deg,#00111d 0%,#001827 48%,#00111c 100%)
  }
  .visual::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 35%,rgba(12,49,66,.17),transparent 48%),linear-gradient(to bottom,rgba(0,0,0,.02),rgba(0,0,0,.15))
  }
  .visual img{display:none}

  .panel{
    position:relative;z-index:2;width:100%;min-height:100svh;padding:0;
    display:block;background:transparent
  }

  .login-view.active{
    width:100%;min-height:100svh;
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 12px)
  }

  .mobile-brand{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding-top:clamp(18px,3.2svh,32px)
  }
  .mobile-brand-title{
    display:block;width:100%;margin:0;text-align:center;white-space:nowrap;
    color:#e1e5e8;font-size:clamp(38px,10.4vw,48px);line-height:.98;
    font-weight:900;letter-spacing:-.028em;
    -webkit-text-stroke:.35px rgba(22,199,212,.55);
    text-shadow:0 1px 0 rgba(255,255,255,.20),0 2px 7px rgba(0,0,0,.52)
  }

  #loginCard{
    align-self:center;justify-self:center;width:min(84vw,620px);margin:12px auto;
    padding:30px 24px 26px;border-radius:24px;
    background:rgba(1,20,33,.48);border:1px solid rgba(0,224,235,.94);
    box-shadow:0 20px 60px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.025);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);color:#f3f5f6
  }
  .login-title{
    position:relative;margin:0 0 38px;padding-bottom:18px;text-align:center;
    color:rgba(248,249,250,.96);font-size:32px;line-height:1;font-weight:800;
    letter-spacing:.015em;text-transform:uppercase
  }
  .login-title::after{
    content:"";position:absolute;left:50%;bottom:0;width:54px;height:3px;
    border-radius:99px;transform:translateX(-50%);background:#13d8df;opacity:.96
  }
  #loginCard .field{margin-bottom:28px}
  #loginCard label{
    margin:0 0 11px;color:rgba(247,248,249,.92);font-size:16px;font-weight:800;
    letter-spacing:.01em;text-transform:uppercase
  }
  #loginCard .input-wrap{position:relative}
  #loginCard input{
    width:100%;height:64px;border:1px solid rgba(174,190,198,.28);border-radius:14px;
    padding:0 18px 0 58px;color:#f5f7f8;font-size:17px;background:rgba(0,7,15,.22);
    box-shadow:none
  }
  #loginCard input::placeholder{color:rgba(229,234,237,.50);opacity:1}
  #loginCard input:focus{
    border-color:rgba(18,132,59,.95);box-shadow:0 0 0 3px rgba(18,132,59,.13);background:rgba(0,12,20,.34)
  }
  .field-icon{
    display:flex;position:absolute;left:18px;top:50%;width:24px;height:24px;
    transform:translateY(-50%);align-items:center;justify-content:center;color:#0fc4c8;pointer-events:none
  }
  .field-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8}
  .eye-toggle{
    display:flex;position:absolute;right:11px;top:50%;width:44px;height:44px;min-height:44px;padding:0;
    transform:translateY(-50%);align-items:center;justify-content:center;border:0;border-radius:50%;
    color:rgba(250,250,250,.92);background:transparent;cursor:pointer
  }
  .eye-toggle svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
  .eye-toggle:focus-visible{outline:2px solid rgba(18,132,59,.8);outline-offset:1px}

  #loginCard .primary{
    width:100%;min-height:64px;margin-top:2px;border-radius:14px;
    background:linear-gradient(180deg,#19b957 0%,#07933d 100%);color:#fff;
    box-shadow:0 10px 25px rgba(3,82,38,.20);font-size:18px;font-weight:850;
    letter-spacing:.035em;text-transform:uppercase
  }
  #loginCard .primary:active{transform:translateY(1px)}
  #loginCard .status{margin-top:9px;min-height:18px;font-size:13px;color:#ffb3ad;text-align:center}
  #loginCard .status.ok{color:#7fd99b}

  .mobile-help{
    display:flex;align-self:end;justify-self:center;align-items:center;justify-content:center;
    gap:10px;width:100%;padding:8px 0 max(2px,env(safe-area-inset-bottom));color:rgba(238,241,243,.72);
    font-size:13px;font-weight:650;letter-spacing:.005em;text-transform:none;white-space:nowrap
  }
  .mobile-help-icon{
    display:grid;place-items:center;width:32px;height:32px;border:1.5px solid rgba(238,241,243,.58);
    border-radius:50%;font-size:20px;line-height:1;color:rgba(238,241,243,.66)
  }

  .session{
    width:calc(100% - 24px);max-width:560px;margin:12px auto;padding:12px 14px;
    border:1px solid rgba(255,255,255,.78);border-radius:16px;background:rgba(255,255,255,.96);
    box-shadow:0 10px 30px rgba(0,0,0,.20)
  }
  .ready,.admin,.password-card{
    width:calc(100% - 24px);max-width:560px;margin:110px auto 24px;padding:22px 18px;border-radius:22px;
    background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.82);
    box-shadow:0 18px 48px rgba(0,0,0,.28)
  }
  .ready h2{font-size:30px}
  .ready p{font-size:16px}
  .ready .primary{width:100%;min-width:0}
  .ready .row{display:grid;grid-template-columns:1fr;gap:10px}
  .admin h2,.password-card h2{font-size:30px}
}

@media(max-width:430px){
  .login-view.active{padding-left:14px;padding-right:14px}
  .mobile-brand{padding-top:clamp(16px,2.8svh,26px)}
  .mobile-brand-title{font-size:clamp(32px,9.2vw,40px)}
  #loginCard{width:min(86vw,370px);padding:27px 20px 23px;border-radius:22px}
  .login-title{font-size:30px;margin-bottom:32px}
  #loginCard .field{margin-bottom:24px}
  #loginCard input{height:60px;font-size:16px}
  #loginCard .primary{min-height:60px}
  .mobile-help{font-size:12px;gap:9px}
  .mobile-help-icon{width:30px;height:30px;font-size:18px}
}

@media(max-height:740px) and (max-width:900px){
  .login-view.active{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
  .mobile-brand{padding-top:10px}
  .mobile-brand-title{font-size:30px}
  #loginCard{padding:20px 18px 17px;margin:7px auto;border-radius:20px}
  .login-title{font-size:27px;margin-bottom:22px;padding-bottom:14px}
  #loginCard .field{margin-bottom:17px}
  #loginCard label{font-size:14px;margin-bottom:7px}
  #loginCard input{height:52px;font-size:15px}
  #loginCard .primary{min-height:52px;font-size:16px}
  #loginCard .status{min-height:14px;margin-top:6px}
  .mobile-help{font-size:11px;padding-top:4px}
  .mobile-help-icon{width:27px;height:27px;font-size:16px}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="visual" aria-label="Safety Walk 2.0">
    <div class="desktop-brand">
      <img class="desktop-brand-art" src="./safety-walk-cover.png?v=20261011-cover2" alt="SAFETY WALK 2.0">
    </div>
  </aside>

  <main class="panel">
    <div id="session" class="session">
      <div>
        <strong id="sessionName"></strong>
        <span id="sessionRole"></span>
      </div>
      <button id="logout" class="secondary">Log Out</button>
    </div>

function fmt(ts){
  if(!ts)return 'Never';
  try{
    return new Intl.DateTimeFormat('en-GB',{dateStyle:'short',timeStyle:'short'}).format(new Date(ts));
  }catch{

function show(id){

  const loginView=$('loginView');

function updateSession(){
  const s=$('session');

    const allowOnsite=isAdmin||currentAccess.allow_onsite===true;
    const allowPremises=isAdmin||currentAccess.allow_office===true||currentAccess.allow_warehouse===true;

    if(onsiteBtn) onsiteBtn.classList.toggle('module-hidden',!allowOnsite);

async function loadOwnProfile(record=false){
  const {data:{user}}=await supabase.auth.getUser();
  if(!user)return null;

  const {data:profile,error}=await supabase
    .from('profiles')
    .select('id,email,display_name,role,active,last_login_at,login_count')
    .eq('id',user.id)
    .single();

  if(error)throw error;

  if(!profile.active){
    await supabase.auth.signOut();
    throw new Error('Your account has been deactivated. Contact the app administrator.');
  }

  if(record){
    const {error:rpcError}=await supabase.rpc('record_login');
    if(rpcError)throw rpcError;

    const {data:r}=await supabase
      .from('profiles')
      .select('id,email,display_name,role,active,last_login_at,login_count')
      .eq('id',user.id)
      .single();

    return r||profile;
  }

  return profile;
}


async function loadOwnAccess(){
  const isAdmin=currentProfile?.role==='admin';
  if(isAdmin){
    accessTableAvailable=true;
    return {allow_onsite:true,allow_office:true,allow_warehouse:true};
  }

  const userId=String(currentProfile?.id||'');
  if(!userId)return {allow_onsite:false,allow_office:false,allow_warehouse:false};

  const {data,error}=await supabase
    .from('safety_access')
    .select('allow_onsite,allow_office,allow_warehouse')
    .eq('user_id',userId)
    .maybeSingle();

  if(error){
    // Safe fallback during staged installation: existing users retain On-Site,
    // while KVI Premises stays closed until the access migration is installed.
    console.warn('Safety access table unavailable:',error);
    accessTableAvailable=false;
    return {allow_onsite:true,allow_office:false,allow_warehouse:false};
  }

  accessTableAvailable=true;
  return {
    allow_onsite:data?.allow_onsite===true,
    allow_office:data?.allow_office===true,
    allow_warehouse:data?.allow_warehouse===true
  };
}

function canOpenOnsite(){
  return currentProfile?.role==='admin'||currentAccess.allow_onsite===true;
}

function canOpenPremises(){
  return currentProfile?.role==='admin'||currentAccess.allow_office===true||currentAccess.allow_warehouse===true;
}

function buildIdentity(){
  const displayName=String(currentProfile?.display_name||'').trim();
  const role=String(currentProfile?.role||'user').trim().toLowerCase();

  if(role!=='admin'&&!displayName){
    throw new Error('The user profile is missing a full name. Contact the App Administrator.');
  }

  return {
    userId:String(currentProfile?.id||''),
    displayName,
    email:String(currentProfile?.email||''),
    role,
    access:{
      onsite:role==='admin'||currentAccess.allow_onsite===true,
      office:role==='admin'||currentAccess.allow_office===true,
      warehouse:role==='admin'||currentAccess.allow_warehouse===true
    }
  };
}

async function openLegacyPrivateModule(fileName,label,allowed){
  status('readyStatus','');

  if(!allowed()){
    status('readyStatus','Access to '+label+' has not been assigned to this account.');
    return;
  }

  status('readyStatus','Opening '+label+'…',true);

  const {data,error}=await supabase.storage
    .from(MODULE_BUCKET)
    .createSignedUrl(fileName,60);

  if(error){
    status('readyStatus','Unable to open '+label+': '+error.message);
    return;
  }

  try{
    const r=await fetch(data.signedUrl);
    if(!r.ok)throw new Error('HTTP '+r.status);

    let html=await r.text();
    if (fileName === KVI_APP_FILE) {
      const versionMarker = "const SAFETY_WALK_VERSION = '1.0';";
      if (!html.includes(versionMarker) && !html.includes("const SAFETY_WALK_VERSION = '2.0';")) throw new Error('Facility version marker missing');
      html = html.replace(versionMarker, "const SAFETY_WALK_VERSION = '2.0';");
    }
    if (fileName === ONSITE_APP_FILE) {
      const valid = html.includes('data-safety-walk-version="2.0-staging"')
        && html.includes('data-sw2-app-gate')
        && html.includes('data-sw2-secure-export')
        && html.includes('SW2ReportExport.protectSnapshot(clearHtml)');
      if (!valid) throw new Error('Safety Walk 2.0 security module missing; opening blocked.');
      const {data:{session},error:sessionError}=await supabase.auth.getSession();
      if (sessionError || !session?.access_token) throw new Error('Login required');
      const check=await fetch(SUPABASE_URL+'/functions/v1/sw2-report-key', {
        method:'POST', cache:'no-store',
        headers:{'Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({action:'status'})
      });
      const approval=await check.json().catch(()=>({}));
      if (!check.ok || approval.approved !== true) throw new Error('On-Site 2.0 approval denied.');
      // Mirror the already-proven iPhone preview's On-Site display version fix.
      // No inspection content, SEND workflow or KVI functionality is changed.
      html=html.replace("const SAFETY_WALK_VERSION = '1.0';", "const SAFETY_WALK_VERSION = '2.0';");
    }
    const identity=buildIdentity();
    const safeIdentityJson=JSON.stringify(identity).replace(/</g,'\\u003c');
    const identityScript='<scr'+'ipt>window.__HSE_SW_IDENTITY='+safeIdentityJson+';</scr'+'ipt>';

    if(html.includes('</head>')){
      html=html.replace('</head>',identityScript+'</head>');
    }else{
      html=identityScript+html;
    }

    document.documentElement.classList.remove('login-locked');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status('readyStatus','Unable to load '+label+': '+(err.message||err));
  }
}

function formatStorageBytes(bytes){
  const n=Number(bytes);
  if(!Number.isFinite(n) || n<0)return '—';
  if(n>=1024*1024*1024)return (n/(1024*1024*1024)).toFixed(n>=10*1024*1024*1024?1:2)+' GB';
  if(n>=1024*1024)return (n/(1024*1024)).toFixed(n>=100*1024*1024?0:1)+' MB';
  if(n>=1024)return (n/1024).toFixed(n>=100*1024?0:1)+' KB';
  return Math.round(n)+' bytes';
}

function quotaPercent(used,limit){
  const u=Number(used);
  if(!Number.isFinite(u) || u<0 || !Number.isFinite(limit) || limit<=0)return null;
  return (u/limit)*100;
}

function storageLevel(percent){
  if(percent>=95)return 'level-critical';
  if(percent>=85)return 'level-warning';
  if(percent>=70)return 'level-watch';
  return '';
}

function renderStorageUsageUnavailable(message='Usage unavailable'){

  const track=card.querySelector('.usage-track');
  track.setAttribute('aria-valuenow','0');
}

async function refreshStorageUsage(){
  const card=$('storageUsageCard');
  card.className='usage-card usage-unavailable';
  $('storageUsageSubtitle').textContent='Checking current project usage…';
  $('storageUsagePercent').textContent='…';
  $('storageUsageBar').style.width='0%';
  $('storageUsageChecked').textContent='Reading verified values from Supabase…';

  try{
    const {data,error}=await supabase.rpc('get_admin_storage_usage');
    if(error)throw error;

    const row=Array.isArray(data)?data[0]:data;
    if(!row)throw new Error('No usage data returned.');

    const databaseBytes=Number(row.database_bytes);
    const storageBytes=Number(row.storage_bytes);

    if(!Number.isFinite(databaseBytes) || databaseBytes<0 ||
       !Number.isFinite(storageBytes) || storageBytes<0){
      throw new Error('Invalid usage data returned.');
    }

    const databasePercent=quotaPercent(databaseBytes,FREE_DATABASE_LIMIT_BYTES);
    const storagePercent=quotaPercent(storageBytes,FREE_FILE_STORAGE_LIMIT_BYTES);
    const highestPercent=Math.max(databasePercent,storagePercent);
    const barPercent=Math.max(0,Math.min(100,highestPercent));

    card.className='usage-card '+storageLevel(highestPercent);
    $('storageUsageSubtitle').textContent='Highest current storage quota utilisation';
    $('storageUsagePercent').textContent=
      (highestPercent<0.05 && highestPercent>0)
        ? '<0.1%'
        : highestPercent.toFixed(highestPercent<10?1:0)+'%';
    $('storageUsageBar').style.width=barPercent.toFixed(2)+'%';

    $('databaseUsageText').textContent=
      formatStorageBytes(databaseBytes)+' / 500 MB ('+
      (databasePercent<0.05 && databasePercent>0?'<0.1':databasePercent.toFixed(databasePercent<10?1:0))+'%)';

    $('fileStorageUsageText').textContent=
      formatStorageBytes(storageBytes)+' / 1 GB ('+
      (storagePercent<0.05 && storagePercent>0?'<0.1':storagePercent.toFixed(storagePercent<10?1:0))+'%)';

    const checked=row.checked_at?new Date(row.checked_at):new Date();
    const checkedText=Number.isNaN(checked.getTime())
      ? 'just now'
      : new Intl.DateTimeFormat('en-GB',{
          day:'2-digit',month:'2-digit',year:'numeric',
          hour:'2-digit',minute:'2-digit'
        }).format(checked);

    $('storageUsageChecked').textContent=
      'Checked '+checkedText+
      ' · Current project only · Free Plan limits verified 22.08.2026.';

    const track=card.querySelector('.usage-track');
    track.setAttribute('aria-valuenow',String(Math.round(barPercent)));

  }catch(err){
    console.warn('Storage usage check failed:',err);
    renderStorageUsageUnavailable('Usage unavailable');
  }
}

async function refreshUsers(){
  status('adminStatus','Loading users…',true);

  const {data,error}=await supabase
    .from('profiles')
    .select('id,email,display_name,role,active,last_login_at,login_count,created_at')
    .order('last_login_at',{ascending:false,nullsFirst:false});

  if(error){
    status('adminStatus',error.message);
    return;
  }

  const {data:accessRows,error:accessError}=await supabase
    .from('safety_access')
    .select('user_id,allow_onsite,allow_office,allow_warehouse');

  if(accessError){
    console.warn('Unable to load safety_access:',accessError);
    accessTableAvailable=false;
  }else{
    accessTableAvailable=true;
  }

  const accessMap=new Map((accessRows||[]).map(row=>[
    row.user_id,
    {
      allow_onsite:row.allow_onsite===true,
      allow_office:row.allow_office===true,
      allow_warehouse:row.allow_warehouse===true
    }
  ]));

  let offlineSettings=null;
  try{
    const {adminDevices}=await import('./sw2/licensing.mjs');
    const result=await adminDevices('offline-settings');
    offlineSettings=new Map(result.settings.map(s=>[s.user_id,s.allow_offline]));
  }catch(error){console.warn('Offline settings unavailable:',error);}

  let clientVersions=new Map();
  try{
    const {data:versionRows,error:versionError}=await supabase.from('sw2_client_versions').select('user_id,last_login_version,last_login_device,last_login_seen_at,last_module,last_module_version,last_module_device,last_module_opened_at');
    if(versionError)throw versionError;
    clientVersions=new Map((versionRows||[]).map(v=>[v.user_id,v]));
  }catch(error){console.warn('Client version information unavailable:',error);}

  const users=(data||[]).map(u=>({
    clientVersion:clientVersions.get(u.id)||null,
    ...u,
    offlineAvailable:offlineSettings!==null,
    allowOffline:offlineSettings?.get(u.id)!==false,
    access:u.role==='admin'
      ? {allow_onsite:true,allow_office:true,allow_warehouse:true}
      : (accessMap.get(u.id)||{allow_onsite:true,allow_office:false,allow_warehouse:false})
  }));

  renderUsers(users);

  if(accessError){
    status('adminStatus','Users loaded. Inspection Access is in safe fallback mode until the access migration is installed.');
  }else{
    status('adminStatus','');
  }
}

async function saveUserAccess(userId,nextAccess,options={}){
  const payload={
    user_id:userId,
    allow_onsite:nextAccess.allow_onsite===true,
    allow_office:nextAccess.allow_office===true,
    allow_warehouse:nextAccess.allow_warehouse===true,
    updated_at:new Date().toISOString()
  };

  const {error}=await supabase
    .from('safety_access')
    .upsert(payload,{onConflict:'user_id'});

  if(error){
    accessTableAvailable=false;
    if(!options.quiet) status('adminStatus','Unable to save Inspection Access: '+error.message);
    throw error;
  }

  accessTableAvailable=true;
  if(!options.quiet) status('adminStatus','Inspection Access updated.',true);
  return payload;
}

function renderUsers(users){
  const box=$('userList');
  box.innerHTML='';

  for(const u of users){
    const row=document.createElement('div');
    row.className='user'+(u.active?'':' disabled');

    const info=document.createElement('div');
    info.className='user-info';
    info.innerHTML=
      '<strong>'+esc(u.display_name||u.email)+'</strong>'+
      '<small>'+esc(u.email)+' · '+(u.role==='admin'?'Administrator':'User')+(u.active?'':' · Deactivated')+'</small>'+
      '<small><b>Last login:</b> '+esc(fmt(u.last_login_at))+'</small>'+
      '<small><b>Login count:</b> '+Number(u.login_count||0)+'</small>'+
      '<small><b>Last Safety Walk version:</b> '+esc(u.clientVersion?.last_login_version||'Not yet recorded')+'</small>'+
      '<small><b>Login device:</b> '+esc(u.clientVersion?.last_login_device||'Not yet recorded')+'</small>'+
      '<small><b>Last module:</b> '+esc(u.clientVersion?.last_module||'Not yet recorded')+'</small>'+
      '<small><b>Module version:</b> '+esc(u.clientVersion?.last_module_version||'Not yet recorded')+'</small>'+
      '<small><b>Module device:</b> '+esc(u.clientVersion?.last_module_device||'Not yet recorded')+'</small>'+
      '<small><b>Last module opened:</b> '+esc(u.clientVersion?.last_module_opened_at?fmt(u.clientVersion.last_module_opened_at):'Not yet recorded')+'</small>';

    const accessBox=document.createElement('div');
    accessBox.className='user-access';

    const title=document.createElement('span');
    title.className='user-access-title';
    title.textContent='Inspection Access';
    accessBox.appendChild(title);

    const accessOptions=document.createElement('div');
    accessOptions.className='access-options';

    const accessDefs=[
      ['allow_onsite','On-Site'],
      ['allow_office','Office Facility'],
      ['allow_warehouse','Warehouse Facility']
    ];

    const accessInputs={};

    for(const [key,labelText] of accessDefs){
      const label=document.createElement('label');
      label.className='access-option';

      const input=document.createElement('input');
      input.type='checkbox';
      input.checked=u.role==='admin'?true:u.access?.[key]===true;
      input.disabled=u.role==='admin'||!accessTableAvailable||!u.active;
      input.dataset.accessKey=key;

      const span=document.createElement('span');
      span.textContent=labelText;

      label.appendChild(input);
      label.appendChild(span);
      accessOptions.appendChild(label);
      accessInputs[key]=input;
    }

    accessBox.appendChild(accessOptions);

    const accessNote=document.createElement('div');
    accessNote.className='user-access-note';
    accessNote.textContent=u.role==='admin'
      ? 'Administrators have full inspection access.'
      : (!accessTableAvailable
          ? 'Access migration not installed — On-Site fallback only.'
          : 'KVI Premises is available when Office and/or Warehouse is selected.');
    accessBox.appendChild(accessNote);

    // Display the developer-account notice only on the designated profile.
    const isDeveloperAccount=String(u.email||'').trim().toLowerCase()==='torben@meirum.eu';
    if(isDeveloperAccount){
      const developerNotice=document.createElement('div');
      developerNotice.className='developer-protection-notice';
      developerNotice.textContent='This account belongs to the Safety Walk application developer and cannot be deleted through User Management.';
      accessBox.appendChild(developerNotice);
    }

    if(u.role!=='admin'&&accessTableAvailable&&u.active){
      Object.values(accessInputs).forEach(input=>{
        input.addEventListener('change',async()=>{
          const next={
            allow_onsite:accessInputs.allow_onsite.checked,
            allow_office:accessInputs.allow_office.checked,
            allow_warehouse:accessInputs.allow_warehouse.checked
          };

          Object.values(accessInputs).forEach(i=>i.disabled=true);
          try{
            await saveUserAccess(u.id,next);
          }catch{
            // Restore from the last confirmed value on failure.
            accessInputs.allow_onsite.checked=u.access?.allow_onsite===true;
            accessInputs.allow_office.checked=u.access?.allow_office===true;
            accessInputs.allow_warehouse.checked=u.access?.allow_warehouse===true;
          }finally{
            Object.values(accessInputs).forEach(i=>i.disabled=false);
          }
        });
      });
    }

    info.appendChild(accessBox);

    const offlineBox=document.createElement('div');
    offlineBox.className='user-access';
    const offlineLabel=document.createElement('label');
    offlineLabel.className='access-option';
    const offlineInput=document.createElement('input');
    offlineInput.type='checkbox';
    offlineInput.dataset.offlineUser=u.id;
    offlineInput.checked=u.offlineAvailable&&u.allowOffline;
    offlineInput.disabled=!u.offlineAvailable||!u.active;
    const offlineText=document.createElement('span');
    offlineText.textContent='Allow offline use · 48 hours';
    offlineLabel.append(offlineInput,offlineText);
    const offlineNote=document.createElement('div');
    offlineNote.className='user-access-note';
    offlineNote.textContent=u.offlineAvailable
      ? '48 hours from the last online approval. Changes apply on reconnection; existing offline approval lasts until expiry.'
      : 'Offline settings unavailable. Reconnect and reload User Management.';
    offlineBox.append(offlineLabel,offlineNote);
    offlineInput.addEventListener('change',async()=>{
      offlineInput.disabled=true;
      try{
        const {adminDevices}=await import('./sw2/licensing.mjs');
        await adminDevices('set-offline',{user_id:u.id,allow_offline:offlineInput.checked});
        u.allowOffline=offlineInput.checked;
        status('adminStatus','Offline approval updated · 48 hours.',true);
      }catch(error){offlineInput.checked=u.allowOffline;status('adminStatus',error.message);}
      finally{offlineInput.disabled=!u.active;}
    });
    info.appendChild(offlineBox);

    const acts=document.createElement('div');
    acts.className='actions';

    const isSelf=u.id===currentProfile?.id;

    if(u.role!=='admin'&&u.active){
      const a=document.createElement('button');
      a.className='promote-admin';
      a.textContent='Make Admin';
      a.onclick=()=>{
        const name=u.display_name||u.email;
        if(confirm(
          'Promote '+name+' to Administrator?\n\n'+
          'This gives the user full User Management and inspection access.'
        )){
          adminAction(
            {action:'promote_admin',user_id:u.id},
            refreshUsers
          );
        }
      };
      acts.appendChild(a);
    }

    if(!isSelf){
      const t=document.createElement('button');
      t.className=u.active?'warning':'secondary';
      t.textContent=u.active?'Deactivate':'Activate';
      t.onclick=()=>adminAction({action:'set_active',user_id:u.id,active:!u.active},refreshUsers);
      acts.appendChild(t);
    }

    const p=document.createElement('button');
    p.className='secondary';
    p.textContent='Reset Password';
    p.onclick=()=>{
      const np=prompt('Enter a new password (minimum 8 characters):');
      if(np===null)return;
      if(np.length<8){
        alert('Password must contain at least 8 characters.');
        return;
      }
      adminAction(
        {action:'reset_password',user_id:u.id,password:np},
        ()=>alert('Password updated successfully.')
      );
    };
    acts.appendChild(p);

    if(!isSelf&&!isDeveloperAccount){
      const d=document.createElement('button');
      d.className='danger';
      d.textContent='Delete';
      d.onclick=()=>{
        const name=u.display_name||u.email;
        const roleText=u.role==='admin'?'Administrator':'User';
        if(confirm(
          'Permanently delete '+name+'?\n\n'+
          'Role: '+roleText+'\n'+
          'This action cannot be undone.'
        )){
          adminAction({action:'delete',user_id:u.id},refreshUsers);
        }
      };
      acts.appendChild(d);
    }

    row.appendChild(info);
    row.appendChild(acts);
    box.appendChild(row);
  }
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[c]));
}

async function adminAction(body,success){
  status('adminStatus','Processing…',true);

  const {data,error}=await supabase.functions.invoke('admin-users',{body});

  if(error){
    status('adminStatus',error.message||'The admin service could not complete the request.');
    return;
  }

  if(data?.error){
    status('adminStatus',data.error);
    return;
  }

  status('adminStatus',data?.message||'Completed successfully.',true);

  if(success)await success(data);
}

$('createUser').onclick=async()=>{
  const display_name=$('newName').value.trim();
  const email=$('newEmail').value.trim().toLowerCase();
  const password=$('newPassword').value;
  const requestedAccess={
    allow_onsite:$('newAccessOnsite').checked,
    allow_office:$('newAccessOffice').checked,
    allow_warehouse:$('newAccessWarehouse').checked
  };

  if(!display_name||!email||password.length<8){
    status('adminStatus','Enter a name and email address. The password must contain at least 8 characters.');
    return;
  }

  await adminAction(
    {action:'create',display_name,email,password},
    async()=>{
      let accessSaved=false;

      try{
        const {data:createdProfile,error:profileError}=await supabase
          .from('profiles')
          .select('id')
          .eq('email',email)
          .single();

        if(profileError)throw profileError;
        await saveUserAccess(createdProfile.id,requestedAccess,{quiet:true});
        accessSaved=true;
      }catch(err){
        console.warn('User created but inspection access could not be saved:',err);
      }

      $('newName').value='';
      $('newEmail').value='';
      $('newPassword').value='';
      $('newAccessOnsite').checked=true;
      $('newAccessOffice').checked=false;
      $('newAccessWarehouse').checked=false;

      await refreshUsers();

      if(accessSaved){
        status('adminStatus','User created and Inspection Access saved.',true);
      }else{
        status('adminStatus','User created. Review Inspection Access before use.');
      }
    }
  );
};

async function boot(){
  const {data:{session}}=await supabase.auth.getSession();

  if(!session){
    show('loginCard');
    return;
  }

  try{
    currentProfile=await loadOwnProfile(false);
    currentAccess=await loadOwnAccess();
    updateSession();
    show('readyCard');
  }catch{
    await supabase.auth.signOut();
    currentProfile=null;
    currentAccess={allow_onsite:true,allow_office:false,allow_warehouse:false};
    updateSession();
    show('loginCard');
  }
}

if('serviceWorker' in navigator)void navigator.serviceWorker.register('./offline-sw.js',{scope:'./'}).catch(()=>{document.documentElement.dataset.sw2OfflineReady='false'});
if(navigator.onLine!==false)boot();else{try{const {openLicensedOnsite}=await import('./sw2/launch.mjs');await openLicensedOnsite();}catch(error){status('loginStatus',error.message);}}
</script>
