<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safety Walk 2.0 – sikker test</title><style>body{background:#eef3f7;color:#173048;font:17px system-ui;margin:0;padding:20px}main{max-width:430px;margin:8vh auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 20px #1232}label{display:block;margin-top:14px}input{display:block;box-sizing:border-box;width:100%;padding:13px;font:inherit;margin-top:5px}button{background:#006970;color:#fff;border:0;border-radius:8px;padding:13px 20px;margin-top:22px;font:inherit;cursor:pointer}#status{min-height:2em}small{display:block;margin-top:20px}</style></head><body><main><h1>Safety Walk 2.0 · TEST</h1><p>Separat test. Safety Walk 1.0 ændres ikke.</p><form id="loginForm"><label>E-mail<input type="email" id="email" autocomplete="username" required></label><label>Adgangskode<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">Åbn On-Site 2.0</button></form><p id="status" role="status"></p><small>Kun allerede godkendte Safety Walk-brugere har adgang.</small></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://hvgljbyethfwxajnrvvi.supabase.co','sb_publishable_pMvJE0yUfBC9KhPl43WGrQ_dUCERa3c');
const form=document.getElementById('loginForm'),status=document.getElementById('status');
form.addEventListener('submit',async event=>{
 event.preventDefault();status.textContent='Logger ind og kontrollerer adgang…';
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 document.getElementById('password').value='';
 if(error||!data.session){status.textContent='Login mislykkedes. Kontrollér e-mail og adgangskode.';return}
 try{
  const res=await fetch('https://hvgljbyethfwxajnrvvi.supabase.co/functions/v1/sw2-preview-cors',{headers:{Authorization:'Bearer '+data.session.access_token},cache:'no-store'});
  if(!res.ok)throw Error('Adgang afvist eller testserver ikke klar ('+res.status+').');
  const html=await res.text();
  if(!html.includes('data-safety-walk-version="2.0-staging"')||!html.includes('data-sw2-app-gate')||!html.includes('data-sw2-secure-export'))throw Error('Sikkerhedsmoduler mangler. Åbning afbrudt.');
  const metadata=data.user.user_metadata||{};
  window.__HSE_SW_IDENTITY={email:data.user.email,user_id:data.user.id,id:data.user.id,full_name:metadata.full_name||data.user.email,name:metadata.full_name||data.user.email};
  history.replaceState(null,'','./');
  document.open();document.write(html);document.close();
 }catch(err){status.textContent=err.message}
});
</script></body></html>
