<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safety Walk 2.0 – Protected Reports</title>
<style>
:root{font-family:system-ui,sans-serif;color:#173048;background:#f1f5f8}*{box-sizing:border-box}body{margin:0}
header{background:#09375b;color:white;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header button{color:#09375b;background:#fff;border:0;border-radius:7px;padding:9px 14px;cursor:pointer}
main{max-width:840px;margin:28px auto;padding:0 18px}.panel{padding:24px;border:1px solid #ccd9e5;background:white;border-radius:12px;margin-bottom:14px}
label{display:block;margin:14px 0 6px}input{display:block;width:100%;padding:12px;border:1px solid #aebed0;border-radius:7px}
button.primary{background:#09676c;color:white;border:0;border-radius:7px;padding:13px 20px;margin-top:16px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}#notice{font-weight:600;margin:14px 0}
#viewerScreen[hidden],#loginScreen[hidden],#pickScreen[hidden]{display:none!important}
#viewerScreen{height:calc(100vh - 65px);display:flex;flex-direction:column}
#viewerHeader{padding:10px 15px;background:#e5f0f4;display:flex;justify-content:space-between;align-items:center}
#inspectionFrame{width:100%;flex:1;border:0;background:#fff}
</style></head><body>
<header><strong>SAFETY WALK 2.0 – Protected Report</strong><button type="button" id="logout">Log Out</button></header>
<main id="workplace">
<section class="panel" id="loginScreen"><h1>Authorised Users Only</h1><form id="loginForm">
<label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<button class="primary" type="submit">Log In</button></form></section>
<section class="panel" id="pickScreen" hidden><h1>Open Encrypted Inspection</h1>
<p>Select the HTML report you received via AirDrop or email.</p>
<input id="reportFile" type="file" accept=".html,text/html">
<button id="openReport" class="primary" type="button" disabled>Open Once Approved</button>
<p>Authorised users can access previously opened reports offline for up to 24 hours. Report contents are not uploaded to the server.</p></section>
<div id="notice" role="status" aria-live="polite"></div></main>
<section id="viewerScreen" hidden><div id="viewerHeader"><span id="viewerStatus">Approved Report</span>
<button type="button" id="closeReport">Close Report</button></div>
<iframe id="inspectionFrame" title="Safety Walk Inspection" sandbox="allow-scripts allow-forms allow-downloads allow-modals"></iframe></section>
<script type="module">
import { sw2Client, approvalApi } from './auth.mjs';
import {forgetApproval,onApprovalChange,invalidateApproval} from './licensing.mjs';
import { readCarrierHtml, decryptHtml, encryptHtml, buildCarrierHtml } from './report-core.mjs';
const $=id=>document.getElementById(id);
let currentFrame=null, timer=null, expiryTimer=null, busy=false, accessEpoch=0;
const show=(id,yes)=>{$(id).hidden=!yes;};
const notice=text=>{$('notice').textContent=text||'';};
function closeReport(){
  accessEpoch++;
  clearInterval(timer);timer=null;clearTimeout(expiryTimer);expiryTimer=null;
  if(currentFrame){currentFrame.removeAttribute('srcdoc');currentFrame.src='about:blank';currentFrame=null;}
  $('viewerScreen').hidden=true;$('workplace').hidden=false;
}
async function checkSession(){
  closeReport();const checkEpoch=accessEpoch;$('workplace').hidden=false;
  try{
    await approvalApi('status');
    if(checkEpoch!==accessEpoch)return;
    show('loginScreen',false);show('pickScreen',true);
    notice('Approved. Select an encrypted report.');
  }catch(error){if(checkEpoch!==accessEpoch)return;show('loginScreen',true);show('pickScreen',false);notice(error.message);}
}
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();notice('Checking authorisation…');
 const {error}=await sw2Client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 $('password').value='';
 if(error){notice('Login failed.');return;}
 await checkSession();
});
$('logout').onclick=async()=>{await forgetApproval();closeReport();show('loginScreen',true);show('pickScreen',false);$('reportFile').value='';$('openReport').disabled=true;notice('Logging out…');try{await sw2Client.auth.signOut();await checkSession();}catch{notice('Unable to confirm logout. Please close this tab.');}};
$('reportFile').onchange=()=>{$('openReport').disabled=!$('reportFile').files?.length;};
$('closeReport').onclick=closeReport;
async function verify(){
  // Keep the approved document and its input focus intact during background checks.
  // The expiry timer still locks it before renewal if its current lease runs out.
  const epoch=accessEpoch;
  const lease=await approvalApi('status');
  if(epoch!==accessEpoch)return;
  clearTimeout(expiryTimer);
  expiryTimer=setTimeout(()=>{
    if(epoch!==accessEpoch||!currentFrame)return;
    currentFrame.inert=true;currentFrame.style.visibility='hidden';
    void verify().catch(()=>{if(epoch===accessEpoch)revoke();});
  },Math.max(0,lease.expires_at-lease.server_time));
  if(currentFrame){if(currentFrame.inert)currentFrame.inert=false;if(currentFrame.style.visibility)currentFrame.style.visibility='';}
}
onApprovalChange(({approved,message})=>{if(!currentFrame)return;if(currentFrame.inert===approved)currentFrame.inert=!approved;const visibility=approved?'':'hidden';if(currentFrame.style.visibility!==visibility)currentFrame.style.visibility=visibility;if(!approved)$('viewerStatus').textContent=message||'Approval required';});
function revoke(){closeReport();$('reportFile').value='';$('openReport').disabled=true;notice('Authorisation could not be verified. The report is locked.');}
$('openReport').onclick=async()=>{
 if(busy)return;busy=true;const requestEpoch=accessEpoch;$('openReport').disabled=true;notice('Opening protected report…');
 try{
  const file=$('reportFile').files?.[0];if(!file)throw Error('Select an encrypted HTML file.');
  if(file.size>140_000_000)throw Error('The file is too large.');
  const pkg=readCarrierHtml(await file.text());
  const {key_b64}=await approvalApi('open',{report_id:pkg.id});
  const clear=await decryptHtml(pkg,key_b64);
  // Never reveal a report if the user logged out or the viewer was locked while the request was pending.
  if(requestEpoch!==accessEpoch)throw Error('Report opening cancelled');
  await verify();
  if(requestEpoch!==accessEpoch)throw Error('Report opening cancelled');
  if(!/^<!doctype html>|<html/i.test(clear.trim()))throw Error('Invalid report content.');
  const frame=$('inspectionFrame');currentFrame=frame;frame.inert=false;frame.style.visibility='';
  // Report iframe has an opaque origin. It cannot read viewer auth tokens.
  // This flag is used by the original SEND function to hand a revised report to its trusted parent.
  const framed=clear.replace(/<head([^>]*)>/i, '<head$1><script>window.__SW2_VIEWER_FRAME=true;' + '</scr' + 'ipt>');
  frame.srcdoc=framed;
  $('viewerScreen').hidden=false;$('workplace').hidden=true;notice('');
  $('viewerStatus').textContent='Safety Walk – Approved';
  timer=setInterval(async()=>{if(!currentFrame)return;const epoch=accessEpoch;try{await verify();if(epoch!==accessEpoch)return;}catch{if(epoch===accessEpoch)revoke();}},15000);
 }catch(e){closeReport();notice(e.message||'Unable to open the report.');}
 finally{busy=false;$('openReport').disabled=!$('reportFile').files?.length;}
};
for(const evt of ['online'])window.addEventListener(evt,async()=>{if(currentFrame){try{await verify();}catch{revoke();}}});
window.addEventListener('offline',async()=>{if(currentFrame){try{await verify();}catch{revoke();}}});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&currentFrame){try{await verify();}catch{revoke();}}});
window.addEventListener('message',async event=>{
 if(!currentFrame||event.source!==currentFrame.contentWindow||event.data?.type!=='sw2-save-request'||busy)return;
 const html=event.data.html;if(typeof html!=='string'||html.length>140_000_000)return;
 const saveEpoch=accessEpoch;
 busy=true;
 try{
  await verify();
  const {package:pkg,key}=await encryptHtml(html);
  await approvalApi('register',{report_id:pkg.id,key_b64:key});
  if(saveEpoch!==accessEpoch||!currentFrame)throw Error('Report closed before save completed');
  // Re-check after the network operation; a revoked account must not receive a new export.
  await verify();
  if(saveEpoch!==accessEpoch||!currentFrame)throw Error('Report closed before save completed');
  const carrier=buildCarrierHtml(pkg,location.href);
  const object=URL.createObjectURL(new Blob([carrier],{type:'text/html'}));
  const a=document.createElement('a');a.href=object;a.download='HSE Safety Walk – Encrypted.html';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(object),8000);
  $('viewerStatus').textContent='Updated encrypted report downloaded.';
 }catch(error){$('viewerStatus').textContent='Unable to save the report: '+error.message;}
 finally{busy=false;}
});
if('serviceWorker' in navigator)void navigator.serviceWorker.register('../offline-sw.js',{scope:'../'}).catch(()=>{document.documentElement.dataset.sw2OfflineReady='false'});
await checkSession();
</script></body></html>
